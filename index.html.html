<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bodywise Match: find your body-care routine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Change colours here. Sample the exact blue from bebodywise.com and paste it into --blue. */
:root{--blue:#1b4fd8;--blue-dark:#12338f;--soft:#eaf0ff;--ink:#0f1b3d;--muted:#5b6585;--line:#dfe5f5;--warn:#fff3e6;--ok:#e9f8ef;--bg:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.top{background:var(--blue);color:#fff;padding:14px 16px;font-weight:700}
.top span{font-weight:400;font-size:.8rem;opacity:.8;margin-left:8px}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 70px}
.hero{background:var(--blue);color:#fff;border-radius:20px;padding:30px 22px;margin-top:6px}
.hero h1{font-size:1.7rem;line-height:1.2;margin-bottom:10px}
.hero p{opacity:.92;margin-bottom:20px}
.steps{display:grid;gap:10px;margin-top:18px}
.step{background:var(--soft);border-radius:14px;padding:13px 16px;font-size:.95rem}
.btn{border:0;border-radius:999px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.p{background:var(--blue);color:#fff}.l{background:#fff;color:var(--blue)}
.g{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bar{height:6px;background:var(--line);border-radius:9px;margin:6px 0 20px}.bar div{height:100%;background:var(--blue);border-radius:9px}
h2{font-size:1.3rem;margin-bottom:12px}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.nav{display:flex;justify-content:space-between}
.tabs{display:flex;gap:6px;margin:6px 0 16px;background:var(--soft);padding:5px;border-radius:999px}
.tab{flex:1;border:0;background:transparent;padding:9px;border-radius:999px;font:inherit;font-weight:600;color:var(--blue);cursor:pointer}
.tab.on{background:var(--blue);color:#fff}
.card{border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{font-size:1.02rem}.sm{color:var(--muted);font-size:.85rem}
.pct{background:var(--soft);color:var(--blue-dark);font-weight:700;border-radius:999px;padding:4px 12px;font-size:.85rem;white-space:nowrap}
ul.why{margin:10px 0;padding-left:18px;font-size:.92rem}
.warn,.note.warn{background:var(--warn);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.det{background:var(--soft);border-radius:12px;padding:14px;margin-top:12px;font-size:.92rem}
.det h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--blue-dark);margin:10px 0 3px}.det h4:first-child{margin-top:0}
.tag{display:inline-block;background:#fff;border-radius:99px;padding:3px 10px;margin:0 6px 6px 0;font-size:.82rem}
.note{border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:.92rem}
.note.ok{background:var(--ok)}.note.tip{background:var(--soft)}
.slot h3{margin:16px 0 8px;font-size:1rem;color:var(--blue-dark)}
.fine{color:var(--muted);font-size:.8rem;margin-top:22px}
.hero{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);box-shadow:0 12px 30px rgba(27,79,216,.25)}
.card{box-shadow:0 2px 10px rgba(15,27,61,.05);animation:in .35s ease both}
.step{border-left:4px solid var(--blue)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn,.chip,.tab{transition:.15s}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(27,79,216,.25)}
:focus-visible{outline:3px solid #7fa0ff;outline-offset:2px}
.ins{display:grid;gap:10px}.ins div{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}.ins b{display:block;color:var(--blue-dark);font-weight:600}.ins span{font-size:.92rem;color:var(--muted)}
.prof{margin-bottom:10px}.how{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.9rem}.how summary{cursor:pointer;font-weight:600;color:var(--blue-dark)}.how p{margin-top:8px}
.tot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:12px 16px;margin-bottom:12px;font-weight:600}
footer{max-width:720px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.78rem}
@media print{.top,.tabs,.btn,.fine,footer{display:none!important}}
</style>
</head>
<body>
<div class="top">Bodywise Match<span>student concept, not an official Be Bodywise app</span></div>
<main class="wrap" id="app"></main>
<footer>Built with Claude as part of a Mosaic Fellowship application, based on five customer conversations. An independent student concept, not affiliated with Be Bodywise. Product details and prices come from bebodywise.com.</footer>
<script>
const SHOP="https://bebodywise.com",B=SHOP+"/product/";
const C=[["underarm","Dark or smelly underarms"],["body-acne","Body acne"],["bumps","Bumpy skin / strawberry legs"],["dull","Dull or rough skin"],["dry","Very dry skin or cracked heels"],["sun","Tan and sun protection"],["stretch","Stretch marks"]];
const lab=v=>(C.find(c=>c[0]===v)||[])[1]||v;
// Products and prices as listed on the Be Bodywise body-care page (24 Nov 2026). Check each product page before submitting.
const P=[
{id:"cer",name:"1% Salicylic Ceramide Body Wash",price:549,url:B+"salicylic-ceramide-bodywash",concerns:["body-acne","bumps","dry"],actives:["Salicylic Acid","Ceramides"],ex:1,gentle:1,hyd:1,when:"shower",about:"Aimed at body acne with barrier care. Give it a few weeks of regular use before judging results.",use:"Lather on wet skin, leave on briefly, rinse well."},
{id:"sal",name:"1% Salicylic Acid Body Wash",price:399,url:B+"1-salicylic-acid-body-wash-350ml",concerns:["body-acne","bumps"],actives:["Salicylic Acid"],ex:1,when:"shower",about:"Aimed at body acne and bumps. Results build with regular use over several weeks.",use:"Lather on wet skin, leave on briefly, rinse well. Moisturise afterwards."},
{id:"aha",name:"5% AHA BHA Exfoliating Body Wash",price:649,url:B+"5-aha-bha-bodywash-700ml",concerns:["dull","bumps","sun"],actives:["AHA","BHA"],ex:1,when:"shower",about:"Exfoliates to help with dullness and tan. Smoother texture is usually the first change.",use:"Start a few times a week and build up if your skin is comfortable."},
{id:"milk",name:"Triple Milk Deep Hydrating Body Wash",price:499,url:B+"triple-milk-deep-hydrating-bodywash-xp",concerns:["dull","dry"],actives:["Milk-based hydrating formula"],gentle:1,hyd:1,when:"shower",about:"A hydrating wash that also targets dullness and tan.",use:"Use daily in the shower and rinse."},
{id:"roll",name:"6% AHA BHA Underarm Roll-On (Flora, 75ml)",price:499,url:B+"6-aha-bha-underarm-roll-on-flora-75ml",concerns:["underarm"],actives:["AHA","BHA"],ex:1,when:"after",about:"Controls odour and works on underarm pigmentation. Tone changes need regular use over weeks.",use:"Apply to clean, dry underarms after your shower."},
{id:"u10",name:"10% Urea Body Lotion (200ml)",price:399,url:B+"10-urea-lotion",concerns:["dry"],actives:["Urea 10%"],gentle:1,hyd:1,when:"after",about:"For very dry and flaky skin. Hydration is usually noticeable within days.",use:"Apply to damp skin after your shower."},
{id:"u20",name:"20% Urea Body Lotion (300ml)",price:569,url:B+"20-urea-lotion-xp",concerns:["dry"],actives:["Urea 20%"],hyd:1,when:"after",about:"A stronger option for very dry, flaky skin.",use:"Apply to dry areas after your shower. Skip broken or irritated skin."},
{id:"heel",name:"20% Urea Foot Roll-On (50ml)",price:399,url:B+"20-urea-roll-on-50ml",concerns:["dry"],actives:["Urea 20%"],hyd:1,when:"after",about:"Targets cracked and rough heels.",use:"Roll on to clean, dry heels, ideally at night."},
{id:"spf",name:"De-Tan SPF 50+ Body Sunscreen Lotion",price:549,url:B+"body-sunscreen-lotion-with-spf-50",concerns:["sun"],actives:["SPF 50+"],gentle:1,when:"out",about:"Protects as soon as it is applied. Reapply through the day.",use:"Apply to exposed skin before going out."},
{id:"str",name:"Anti-Stretch Mark Serum Roll-On",price:599,url:B+"anti-stretch-mark-roll-on",concerns:["stretch"],actives:["Regeneryl"],gentle:1,when:"after",about:"Works gradually and results vary from person to person. Read the brand's claims on the product page.",use:"Roll onto the area daily and massage in."}
];
const Q=[
{id:"concerns",t:"What would you like help with?",multi:1,o:C},
{id:"skin",t:"What is your skin type?",o:[["oily","Oily"],["dry","Dry"],["combination","Combination"],["normal","Normal"]]},
{id:"sens",t:"How sensitive is your skin?",o:[["very","Very sensitive"],["some","Sometimes reacts"],["no","Not sensitive"]]},
{id:"acids",t:"Do you already use exfoliating acids (salicylic, AHA, BHA, glycolic)?",o:[["yes","Yes"],["no","No"],["unsure","Not sure"]]},
{id:"n",t:"How many products do you want to start with?",o:[["2","1 or 2"],["3","About 3"],["5","Show me more"]]}
];
const SLOTS=[["shower","In the shower"],["after","After the shower"],["out","Before going out"]];
let S={view:"home",step:0,open:null,routine:[],a:{concerns:[],skin:"",sens:"",acids:"",n:""}};
try{const x=JSON.parse(localStorage.getItem("bw")||"null");if(x){S.a=x.a;S.routine=x.routine}}catch(e){}
const save=()=>{try{localStorage.setItem("bw",JSON.stringify({a:S.a,routine:S.routine}))}catch(e){}};

function rank(){const a=S.a;return P.map(p=>{let s=0,why=[],warn=[];
const hit=p.concerns.filter(c=>a.concerns.includes(c));s+=hit.length*5;
if(hit.length)why.push("Targets: "+hit.map(lab).join(", "));
if(a.skin==="dry"){if(p.hyd){s+=2;why.push("Hydrating, which suits dry skin")}else if(p.ex){s-=1;warn.push("Exfoliating products can feel drying. Follow with a moisturiser.")}}
if(a.skin==="oily"&&p.ex&&hit.includes("body-acne")){s+=1;why.push("Exfoliating formulas suit oily, acne-prone skin")}
if(a.sens&&a.sens!=="no"){if(p.ex){s-=4;warn.push("Contains exfoliating acids. Patch test first and start on alternate days.")}else if(p.gentle){s+=2;why.push("A gentler formula for sensitive skin")}}
if(a.acids==="yes"&&p.ex){s-=1;warn.push("You already use acids, so don't layer this with them.")}
return{...p,s,why,warn,hit}}).filter(p=>p.hit.length).sort((x,y)=>y.s-x.s)}

function compat(list){const n=[],ex=list.filter(p=>p.ex);
if(ex.length>=2)n.push(["warn",ex.map(p=>p.name).join(" + ")+" all contain exfoliating acids. Use them on alternate days rather than together."]);
if(S.a.acids==="yes"&&ex.length)n.push(["warn","You already use exfoliating acids. Add new ones one at a time."]);
if(ex.length&&list.some(p=>p.id==="u20"))n.push(["tip","A 20% urea lotion and exfoliating acids can be a lot for sensitive skin. Use them on different days."]);
if(list.some(p=>p.id==="roll"))n.push(["tip","If your underarms feel irritated after shaving, give them a day before using the roll-on."]);
if(ex.length&&!list.some(p=>p.id==="spf"))n.push(["tip","Exfoliating acids can make skin more sun-sensitive. A sunscreen before going out pairs well."]);
if(list.length&&!n.length)n.push(["ok","No conflicts found between these products."]);return n}

function offers(res){const a=S.a,o=[];
if(res.some(p=>p.id==="roll"))o.push(["Advanced Underarm Pigmentation Kit","A kit of 2 underarm roll-ons, listed at ₹859 (₹998 before discount). Handy if you plan to stay with it.",B+"advanced-underarm-pigmentation-kit"]);
if(a.concerns.includes("sun"))o.push(["Sun Care Duo for Face and Body","A kit of 2 for de-tan and sun protection, listed at ₹949 (₹1098 before discount).",B+"sun-care-duo-head-to-toe"]);
if(a.concerns.includes("dry"))o.push(["Daily Hydration Kit","For very dry skin and cracked heels, listed at ₹1071 (₹1098 before discount).",B+"daily-hydration-kit"]);
if(a.sens&&a.sens!=="no")o.push(["Start with one","With sensitive skin, try a single product first before building a full routine.",SHOP+"/shop/body-care"]);
o.push(["See current deals","Prices and offers change, so check the live offers page before you buy.",SHOP+"/shop/offer-zone"]);return o}

const $=s=>document.querySelector(s);
function card(p,max){const pc=Math.max(10,Math.min(100,Math.round(p.s/max*100))),inR=S.routine.includes(p.id),op=S.open===p.id;
return`<div class="card"><div class="hd"><div><h3>${p.name}</h3><div class="sm">₹${p.price}</div></div><div class="pct">${pc}% match</div></div>
<ul class="why">${p.why.map(w=>`<li>${w}</li>`).join("")}</ul>${p.warn.map(w=>`<div class="warn">⚠ ${w}</div>`).join("")}
<div class="row"><button class="btn g" data-a="open" data-v="${p.id}">${op?"Hide details":"Ingredients and suitability"}</button><button class="btn p" data-a="tog" data-v="${p.id}">${inR?"Remove from routine":"Add to routine"}</button></div>
${op?`<div class="det"><h4>Key ingredients</h4>${p.actives.map(x=>`<span class="tag">${x}</span>`).join("")}<h4>Formula</h4>${p.ex?"Contains exfoliating acids. Start gradually.":"No exfoliating acids listed."}<h4>What to expect</h4>${p.about}<h4>How to use</h4>${p.use}<h4>Full ingredients and testing</h4>The complete ingredient list and testing information are on the <a href="${p.url}" target="_blank" rel="noopener">product page</a>.</div>`:""}</div>`}

function tabs(){return`<div class="tabs">${[["results","Matches"],["routine","Routine ("+S.routine.length+")"],["offers","Offers"]].map(t=>`<button class="tab ${S.view===t[0]?"on":""}" data-a="go" data-v="${t[0]}">${t[1]}</button>`).join("")}</div>`}

function render(){const v=S.view,a=S.a;let h="";
const res=rank().slice(0,+a.n||3),max=a.concerns.length*5+4;
if(v==="home")h=`<section class="hero"><h1>Find the right body care for your skin, not just any product.</h1><p>Answer five quick questions. We match real Be Bodywise body-care products to your concerns and skin, explain what is in them, and help you build a routine that works together.</p><button class="btn l" data-a="go" data-v="quiz">Start the quiz</button>${a.concerns.length&&a.n?` <button class="btn g" style="color:#fff;border-color:#fff" data-a="go" data-v="results">See my last matches</button>`:""}</section>
<div class="steps"><div class="step">1. Tell us your concerns and skin type</div><div class="step">2. See ranked matches and why they fit</div><div class="step">3. Check ingredients and what to expect</div><div class="step">4. Build a routine that is safe to combine</div></div>
<h2 style="margin-top:26px">Built from real customer conversations</h2><div class="ins"><div><b>What should I expect, and when?</b><span>Customers wanted honest timelines, so every match explains what to expect.</span></div><div><b>Will this suit my skin?</b><span>Sensitivity is checked first, with warnings before you buy.</span></div><div><b>I only knew one product.</b><span>One quiz opens up the wider range and shows what works together.</span></div></div><p class="fine">Your answers stay in your own browser. This is a student concept project and not medical advice.</p>`;
if(v==="quiz"){const q=Q[S.step],val=a[q.id],ok=q.multi?val.length>0:!!val;
h=`<div class="bar"><div style="width:${(S.step+1)/Q.length*100}%"></div></div><h2>${q.t}</h2>${q.multi?'<p class="sm" style="margin-bottom:12px">Pick as many as you like.</p>':""}
<div class="opts">${q.o.map(o=>`<button class="chip ${(q.multi?val.includes(o[0]):val===o[0])?"on":""}" data-a="pick" data-v="${o[0]}">${o[1]}</button>`).join("")}</div>
<div class="nav"><button class="btn g" data-a="back">Back</button><button class="btn p" data-a="next" ${ok?"":"disabled"}>${S.step===Q.length-1?"See my matches":"Next"}</button></div>`}
if(v==="results")h=tabs()+`<h2>Your matches</h2><div class="prof">${a.concerns.map(c=>`<span class="tag">${lab(c)}</span>`).join("")}${a.skin?`<span class="tag">${a.skin} skin</span>`:""}${a.sens==="very"||a.sens==="some"?'<span class="tag">sensitive</span>':""}</div><details class="how"><summary>How were these ranked?</summary><p>Each product earns points for every concern it targets. It gains points if it suits your skin type, and loses points if it is an exfoliating acid and your skin is sensitive or you already use acids. We show the top few and tell you why.</p></details>${res.length?res.map(p=>card(p,max)).join(""):'<p class="sm">No matches yet. Retake the quiz and pick at least one concern.</p>'}<button class="btn g" data-a="go" data-v="quiz">Retake quiz</button><p class="fine">Matches use your answers and general product information. Patch test new products and see a doctor for persistent skin problems.</p>`;
if(v==="routine"){const L=P.filter(p=>S.routine.includes(p.id));
h=tabs()+`<h2>My routine</h2>${L.length?`<div class="tot"><span>${L.length} product${L.length>1?"s":""} · about ₹${L.reduce((t,p)=>t+p.price,0)} in total</span><button class="btn g" data-a="print">Save as PDF</button></div>`:'<div class="card"><p class="sm">Nothing saved yet. Add products from your matches.</p><div class="row"><button class="btn p" data-a="go" data-v="results">See my matches</button></div></div>'}${compat(L).map(n=>`<div class="note ${n[0]}">${n[1]}</div>`).join("")}${SLOTS.map(s=>{const it=L.filter(p=>p.when===s[0]);return it.length?`<div class="slot"><h3>${s[1]}</h3>${it.map(p=>`<div class="card"><div class="hd"><h3>${p.name}</h3><button class="btn g" data-a="tog" data-v="${p.id}">Remove</button></div><p class="sm" style="margin-top:6px">${p.use}</p></div>`).join("")}</div>`:""}).join("")}`}
if(v==="offers")h=tabs()+`<h2>Relevant for you</h2>${offers(res).map(o=>`<div class="card"><h3>${o[0]}</h3><p style="margin:6px 0 12px">${o[1]}</p><a class="btn p" href="${o[2]}" target="_blank" rel="noopener">Check on Be Bodywise</a></div>`).join("")}<p class="fine">Prices shown were listed on bebodywise.com on 24 Nov 2026 and may change.</p>`;
$("#app").innerHTML=h}

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const k=b.dataset.a,v=b.dataset.v,q=Q[S.step];
if(k==="go"){S.view=v;if(v==="quiz")S.step=0;window.scrollTo(0,0)}
else if(k==="pick"){if(q.multi){const l=S.a[q.id];S.a[q.id]=l.includes(v)?l.filter(x=>x!==v):[...l,v]}else S.a[q.id]=v}
else if(k==="next"){if(S.step===Q.length-1)S.view="results";else S.step++;window.scrollTo(0,0)}
else if(k==="back"){if(S.step===0)S.view="home";else S.step--}
else if(k==="tog"){S.routine=S.routine.includes(v)?S.routine.filter(x=>x!==v):[...S.routine,v]}
else if(k==="open"){S.open=S.open===v?null:v}
else if(k==="print"){window.print();return}
save();render()});
render();
</script>
</body>
</html>
